name: Deploy Loon and Surge app

on:
  push:
    branches: [main]
    paths:
      - "src/app/**"
      - "src/core/rewrite.js"
      - "template/**"
      - "scripts/build-app.mjs"
      - "package.json"
      - ".github/workflows/app-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test proxy app
        run: node --test test/app-*.test.js
      - name: Build proxy app
        run: node scripts/build-app.mjs
      - name: Check generated scripts
        run: |
          node --check dist/app/bilibili-accelerator.request.js
          node --check dist/app/bilibili-accelerator.response.js
          node --check dist/app/bilibili-accelerator.rank.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
